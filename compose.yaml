name: duong-an

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-duong_an_v11}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Ho_Chi_Minh
    command: ["--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql/migrations/V1__design_v1_1.sql:/docker-entrypoint-initdb.d/01_V1__design_v1_1.sql:ro
      - ./database/mysql/migrations/V2__business_guards.sql:/docker-entrypoint-initdb.d/02_V2__business_guards.sql:ro
      - ./database/mysql/migrations/V3__seed_center.sql:/docker-entrypoint-initdb.d/03_V3__seed_center.sql:ro
      - ./database/mysql/migrations/V4__programs_and_domains.sql:/docker-entrypoint-initdb.d/04_V4__programs_and_domains.sql:ro
      - ./database/mysql/migrations/V5__goal_bank_hierarchy.sql:/docker-entrypoint-initdb.d/05_V5__goal_bank_hierarchy.sql:ro
      - ./database/mysql/migrations/V6__catalog_short_ids.sql:/docker-entrypoint-initdb.d/06_V6__catalog_short_ids.sql:ro
      - ./database/mysql/migrations/V7__student_goal_bank.sql:/docker-entrypoint-initdb.d/07_V7__student_goal_bank.sql:ro
      - ./database/mysql/migrations/V8__shared_program_domains.sql:/docker-entrypoint-initdb.d/08_V8__shared_program_domains.sql:ro
      - ./database/mysql/migrations/V9__student_profile_codes_and_relationships.sql:/docker-entrypoint-initdb.d/09_V9__student_profile_codes_and_relationships.sql:ro
      - ./database/mysql/migrations/V10__staff_guardian_codes.sql:/docker-entrypoint-initdb.d/10_V10__staff_guardian_codes.sql:ro
      - ./database/mysql/migrations/V11__plan_goal_evaluations.sql:/docker-entrypoint-initdb.d/11_V11__plan_goal_evaluations.sql:ro
      - ./database/mysql/migrations/V12__plan_evaluations.sql:/docker-entrypoint-initdb.d/12_V12__plan_evaluations.sql:ro
      - ./database/mysql/migrations/V13__replace_plan_goal.sql:/docker-entrypoint-initdb.d/13_V13__replace_plan_goal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
    name: duong-an-mysql-data
